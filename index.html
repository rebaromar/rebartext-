<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REBAR IT</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: "Noto Sans Arabic", "Noto Kufi Arabic", Tahoma, Arial, sans-serif;
      background: linear-gradient(180deg, #f5fbff 0%, #edf7fc 100%);
      color:#0f172a;
      min-height:100vh;
    }

    .page-wrap{
      min-height:100vh;
      padding:28px 18px 40px;
    }

    .container{
      width:100%;
      max-width:1150px;
      margin:0 auto;
    }

    /* ================= HEADER ================= */
    .top-header{
      direction:ltr;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      margin-bottom:22px;
      flex-wrap:wrap;
    }

    .brand-side{
      display:flex;
      align-items:center;
      gap:16px;
      min-width:0;
    }

    .logo-frame{
      width:118px;
      height:118px;
      border-radius:24px;
      background:#ffffff;
      border:1px solid #dbe8f2;
      box-shadow:0 12px 30px rgba(15, 23, 42, 0.08);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      padding:8px;
      flex-shrink:0;
    }

    .logo-frame img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .brand-text{
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:4px;
      text-align:left;
    }

    .brand-title{
      font-size:44px;
      line-height:1;
      font-weight:900;
      letter-spacing:0.5px;
      color:#0f172a;
    }

    .brand-title span{
      color:#1da9e8;
    }

    .brand-note{
      font-size:15px;
      color:#64748b;
      font-weight:700;
      letter-spacing:0.8px;
    }

    .admin-badge{
      display:flex;
      align-items:center;
      gap:10px;
      background:#ffffff;
      border:1px solid #dce8f1;
      border-radius:999px;
      padding:12px 18px;
      box-shadow:0 10px 24px rgba(15,23,42,0.06);
      font-size:16px;
      font-weight:900;
      color:#0f172a;
      flex-shrink:0;
    }

    .admin-dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:#22c55e;
      box-shadow:0 0 10px rgba(34,197,94,.45);
    }

    .admin-shield{
      width:36px;
      height:36px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg, #20bdf7, #1295d5);
      box-shadow:0 10px 20px rgba(18,149,213,0.25);
      flex-shrink:0;
    }

    .admin-shield svg{
      width:18px;
      height:18px;
      fill:#fff;
    }

    /* ================= MAIN CARD ================= */
    .card{
      background:#ffffff;
      border-radius:34px;
      border-top:5px solid #2cb5ea;
      box-shadow:0 24px 70px rgba(15, 23, 42, 0.08);
      padding:58px 28px 38px;
      max-width:980px;
      margin:0 auto;
    }

    .login-box{
      max-width:620px;
      margin:0 auto;
      text-align:center;
    }

    .center-security{
      width:98px;
      height:98px;
      margin:0 auto 20px;
      border-radius:28px;
      background:#f3fbff;
      border:1px solid #d9eff8;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 10px 24px rgba(15,23,42,0.04);
    }

    .center-security svg{
      width:44px;
      height:44px;
      fill:#18a8ea;
    }

    .title{
      font-size:48px;
      font-weight:900;
      line-height:1.25;
      color:#111827;
      margin-bottom:12px;
    }

    .desc{
      font-size:21px;
      line-height:1.95;
      color:#4b5563;
      margin-bottom:30px;
    }

    .field{
      text-align:right;
      margin-bottom:18px;
    }

    .field label{
      display:block;
      font-size:23px;
      font-weight:800;
      color:#111827;
      margin-bottom:10px;
    }

    .field input{
      width:100%;
      height:66px;
      border-radius:20px;
      border:2px solid #e5e7eb;
      background:#fff;
      padding:0 20px;
      font-size:24px;
      color:#111827;
      outline:none;
      transition:0.2s ease;
    }

    .field input:focus{
      border-color:#33b3ea;
      box-shadow:0 0 0 5px rgba(51,179,234,0.12);
    }

    .btn{
      width:100%;
      height:68px;
      border:none;
      border-radius:20px;
      background:linear-gradient(90deg, #1fb9f4, #129cda);
      color:#fff;
      font-size:26px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 16px 28px rgba(18,156,218,0.25);
      transition:0.2s ease;
    }

    .btn:hover{
      transform:translateY(-1px);
      opacity:0.98;
    }

    .status{
      margin-top:16px;
      min-height:28px;
      font-size:18px;
      font-weight:700;
      color:#dc2626;
    }

    /* ================= RESPONSIVE ================= */
    @media (max-width: 900px){
      .brand-title{
        font-size:36px;
      }

      .logo-frame{
        width:96px;
        height:96px;
      }

      .card{
        padding:42px 20px 30px;
        border-radius:26px;
      }

      .title{
        font-size:38px;
      }

      .desc{
        font-size:18px;
      }

      .field label{
        font-size:20px;
      }

      .field input{
        height:60px;
        font-size:21px;
      }

      .btn{
        height:60px;
        font-size:23px;
      }
    }

    @media (max-width: 640px){
      .top-header{
        flex-direction:column;
        align-items:stretch;
      }

      .brand-side{
        justify-content:flex-start;
      }

      .admin-badge{
        align-self:flex-end;
      }

      .brand-title{
        font-size:30px;
      }

      .brand-note{
        font-size:13px;
      }

      .logo-frame{
        width:86px;
        height:86px;
      }

      .title{
        font-size:32px;
      }

      .desc{
        font-size:16px;
      }

      .field label{
        font-size:18px;
      }

      .field input{
        font-size:18px;
      }

      .btn{
        font-size:20px;
      }
    }
  </style>
</head>

          <h1 class="title">بەشی بەڕێوەبەر</h1>
          <p class="desc">
            بۆ پاراستنی زانیارییەکان، تەنها بە پاسۆردی بەڕێوەبەر دەتوانرێت بچیتە ژوورەوە.
          </p>

          <div class="field">
            <label for="adminPassword">پاسۆردی بەڕێوەبەر</label>
            <input type="password" id="adminPassword" placeholder="••••••••" />
          </div>

          <button class="btn" onclick="checkAdminPassword()">چوونەژوورەوە</button>

          <div id="status" class="status"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    async function checkAdminPassword() {
      const password = document.getElementById("adminPassword").value.trim();
      const status = document.getElementById("status");

      if (!password) {
        status.textContent = "تکایە پاسۆرد بنووسە.";
        return;
      }

      status.style.color = "#2563eb";
      status.textContent = "چاوەڕێ بکە...";

      try {
        /* 
          ئەگەر API ـت هەیە، ئەم fetch ـە بهێڵە.
          ئەگەر route ـەکەت جیاوازە، تەنها /api/login بگۆڕە.
        */
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ password })
        });

        let data = {};
        try {
          data = await response.json();
        } catch (e) {}

        if (response.ok && (data.success || data.ok)) {
          status.style.color = "#16a34a";
          status.textContent = "بە سەرکەوتوویی چوویتە ژوورەوە.";
          setTimeout(() => {
            window.location.href = data.redirect || "/admin";
          }, 700);
        } else {
          status.style.color = "#dc2626";
          status.textContent = data.message || "پاسۆرد هەڵەیە.";
        }
      } catch (error) {
        status.style.color = "#dc2626";
        status.textContent = "کێشەی پەیوەندی هەیە. دواتر هەوڵ بدەوە.";
      }
    }
  </script>
