<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4f8fb">
  <title>REBAR IT</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&family=Inter:wght@600;700;800;900&display=swap');

    :root{
      --blue:#078fd1;
      --cyan:#37bef0;
      --text:#0f172a;
      --muted:#64748b;
      --green:#16a66a;
      --red:#d94b5c;
      --line:#dce6ee;
    }

    *{
      box-sizing:border-box;
    }

    html,body{
      margin:0;
      min-height:100%;
    }

    body{
      font-family:"Noto Sans Arabic",Tahoma,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 12% 0%,rgba(55,190,240,.14),transparent 27%),
        radial-gradient(circle at 92% 4%,rgba(7,143,209,.09),transparent 24%),
        linear-gradient(180deg,#fbfdff 0%,#f3f8fb 50%,#edf3f7 100%);
      padding:0 14px 36px;
    }

    button,input,textarea{
      font-family:inherit;
    }

    .shell{
      width:100%;
      max-width:980px;
      margin:auto;
    }

    .hidden{
      display:none !important;
    }

    /* HEADER */

    .topbar{
      direction:ltr;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      min-height:120px;
      padding:18px 0 14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:17px;
    }

    .brand-logo-circle{
      width:104px;
      height:104px;
      flex:0 0 104px;
      border-radius:50%;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#02070d;
      border:3px solid #fff;
      box-shadow:
        0 0 0 2px rgba(7,143,209,.28),
        0 12px 30px rgba(15,23,42,.17);
    }

    .brand-logo-circle img{
      width:100%;
      height:100%;
      object-fit:contain;
      padding:7px;
      display:block;
      background:#02070d;
    }

    .brand-info{
      direction:ltr;
      text-align:left;
    }

    .brand-name{
      direction:ltr;
      display:flex;
      align-items:center;
      font-family:Inter,Arial,sans-serif;
      font-size:38px;
      font-weight:900;
      line-height:1;
      white-space:nowrap;
    }

    .rebar{
      color:var(--blue);
    }

    .it{
      color:#111827;
      margin-left:9px;
    }

    .brand-subtitle{
      margin-top:9px;
      color:#6f8092;
      font-family:Inter,Arial,sans-serif;
      font-size:11px;
      font-weight:800;
      letter-spacing:1.5px;
    }

    .admin-status{
      direction:ltr;
      display:flex;
      align-items:center;
      gap:9px;
      padding:10px 15px;
      border-radius:999px;
      background:#fff;
      border:1px solid #dbe7ee;
      box-shadow:0 8px 22px rgba(15,23,42,.06);
      font-family:Inter,Arial,sans-serif;
      font-size:11px;
      font-weight:800;
    }

    .admin-mini-shield{
      width:30px;
      height:30px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,var(--blue),var(--cyan));
    }

    .admin-mini-shield svg{
      width:15px;
      height:15px;
      fill:#fff;
    }

    .online-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:#22b873;
      box-shadow:0 0 0 4px rgba(34,184,115,.11);
    }

    /* CARD */

    .card{
      width:100%;
      background:#fff;
      border:1px solid #d8e2ea;
      border-radius:28px;
      box-shadow:0 24px 65px rgba(15,23,42,.09);
      overflow:hidden;
    }

    .card::before{
      content:"";
      display:block;
      height:4px;
      background:linear-gradient(90deg,var(--blue),var(--cyan),#8be5ff);
    }

    /* SECURITY ICON */

    .security-logo{
      width:88px;
      height:88px;
      margin:0 auto 20px;
      border-radius:26px;
      display:grid;
      place-items:center;
      background:linear-gradient(145deg,#f6fcff,#eaf8fd);
      border:1px solid #cde8f4;
      box-shadow:0 12px 28px rgba(7,143,209,.09);
    }

    .security-logo svg{
      width:45px;
      height:45px;
    }

    /* LOGIN */

    .login-area{
      max-width:560px;
      margin:auto;
      padding:46px 30px 38px;
    }

    .login-title{
      margin:0 0 8px;
      text-align:center;
      font-size:30px;
      font-weight:900;
    }

    .login-description{
      max-width:440px;
      margin:0 auto 24px;
      text-align:center;
      color:#607086;
      font-size:14px;
      line-height:2.15;
    }

    /* FIELDS */

    .field{
      margin-bottom:15px;
    }

    .field label{
      display:block;
      margin:0 4px 9px;
      color:#27364a;
      font-size:14px;
      font-weight:800;
    }

    .field input,
    .field textarea{
      width:100%;
      min-height:55px;
      padding:13px 15px;
      border:1px solid #d5dfe7;
      border-radius:16px;
      outline:none;
      background:#fbfdfe;
      color:#111827;
      font-size:14px;
    }

    .field textarea{
      min-height:118px;
      resize:vertical;
      line-height:2;
    }

    .field input:focus,
    .field textarea:focus{
      background:#fff;
      border-color:#50bce8;
      box-shadow:0 0 0 4px rgba(7,143,209,.09);
    }

    .ltr{
      direction:ltr;
      text-align:left;
      font-family:Inter,Arial,sans-serif;
    }

    /* BUTTONS */

    button,
    .button{
      border:0;
      cursor:pointer;
      min-height:52px;
      padding:12px 18px;
      border-radius:16px;
      display:inline-flex;
      justify-content:center;
      align-items:center;
      text-decoration:none;
      font-size:13px;
      font-weight:900;
    }

    .primary{
      color:#fff;
      background:linear-gradient(135deg,#078fd1,#35bdf0);
      box-shadow:0 13px 27px rgba(7,143,209,.22);
    }

    .secondary{
      color:#334155;
      background:#f7f9fb;
      border:1px solid #dae3ea;
    }

    .danger{
      color:#b3263b;
      background:#fff3f5;
      border:1px solid #f4cad1;
    }

    .wide{
      width:100%;
    }

    /* NOTICE */

    .notice{
      display:none;
      margin-top:14px;
      padding:12px 14px;
      border-radius:14px;
      font-size:12px;
      line-height:2;
    }

    .notice.ok{
      display:block;
      color:#0d784f;
      background:#eefbf4;
      border:1px solid #bbe8cf;
    }

    .notice.err{
      display:block;
      color:#b2293d;
      background:#fff3f5;
      border:1px solid #f4c8cf;
    }

    /* ADMIN */

    .admin-header{
      padding:25px 27px 19px;
      border-bottom:1px solid #edf1f4;
    }

    .admin-header h1{
      margin:0;
      font-size:25px;
      font-weight:900;
    }

    .admin-header p{
      margin:6px 0 0;
      color:#6b7c90;
      font-size:12px;
      line-height:2;
    }

    .tabs{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:8px;
      padding:14px 18px;
      background:#f8fafc;
      border-bottom:1px solid #edf1f4;
    }

    .tab{
      min-height:45px;
      border:1px solid #dbe3e9;
      border-radius:13px;
      background:#fff;
      color:#627287;
      font-size:11px;
    }

    .tab.active{
      color:#fff;
      background:linear-gradient(135deg,#0c1b2b,#193b56);
    }

    .content{
      padding:24px 27px 28px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .full{
      grid-column:1/-1;
    }

    .button-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:18px;
    }

    /* RESULT */

    .result{
      display:none;
      margin-top:16px;
      padding:15px;
      border:1px dashed #9ddaf1;
      border-radius:16px;
      background:#f5fcff;
    }

    .result code{
      display:block;
      direction:ltr;
      text-align:left;
      word-break:break-all;
      color:#075985;
      font:700 12px/1.9 Inter,Arial,sans-serif;
    }

    /* PUBLIC */

    .public-head{
      padding:28px 24px 22px;
      text-align:center;
      border-bottom:1px solid #edf2f5;
    }

    .public-head h1{
      margin:0;
      direction:ltr;
      font:900 29px/1.2 Inter,Arial,sans-serif;
    }

    .public-head h1 span{
      color:var(--blue);
    }

    .public-head p{
      margin:8px 0 0;
      color:#7b8a9b;
      font:800 10px/1.6 Inter,Arial,sans-serif;
      letter-spacing:.8px;
    }

    .credential{
      margin-bottom:12px;
      padding:13px 14px;
      border:1px solid #dce4eb;
      border-radius:16px;
      background:#f9fbfc;
    }

    .credential small{
      display:block;
      margin-bottom:5px;
      color:#77879a;
      font-size:11px;
      font-weight:800;
    }

    .credential-row{
      display:flex;
      align-items:center;
      gap:9px;
    }

    .credential input{
      flex:1;
      min-width:0;
      border:0;
      outline:0;
      background:transparent;
      direction:ltr;
      text-align:left;
      font:800 14px Inter,Arial,sans-serif;
    }

    .copy-button{
      min-height:36px;
      padding:0 12px;
      border:1px solid #d7e0e8;
      border-radius:11px;
      background:#fff;
      color:#425267;
      font-size:10px;
    }

    .note{
      margin-top:14px;
      padding:14px 15px;
      border:1px solid #dce4eb;
      border-radius:15px;
      background:#fafcfd;
      font-size:12px;
      line-height:2;
      white-space:pre-wrap;
    }

    .record-status{
      display:flex;
      justify-content:space-between;
      margin-top:17px;
      padding-top:14px;
      border-top:1px solid #edf1f4;
      color:#8693a3;
      font-size:10px;
    }

    .active-dot{
      display:inline-block;
      width:8px;
      height:8px;
      margin-left:6px;
      border-radius:50%;
      background:#16a66a;
    }

    @media(max-width:700px){

      body{
        padding:0 9px 26px;
      }

      .topbar{
        min-height:96px;
        gap:10px;
      }

      .brand{
        gap:10px;
      }

      .brand-logo-circle{
        width:74px;
        height:74px;
        flex-basis:74px;
      }

      .brand-logo-circle img{
        padding:5px;
      }

      .brand-name{
        font-size:22px;
      }

      .brand-subtitle{
        font-size:8px;
      }

      .admin-status{
        padding:7px 9px;
        font-size:9px;
      }

      .admin-mini-shield{
        width:24px;
        height:24px;
      }

      .login-area{
        padding:32px 17px 28px;
      }

      .login-title{
        font-size:23px;
      }

      .grid{
        grid-template-columns:1fr;
      }

      .full{
        grid-column:auto;
      }

      .admin-header,
      .content{
        padding-left:16px;
        padding-right:16px;
      }
    }
  </style>
</head>

<body>

<div class="shell">

  <header class="topbar">

    <div class="brand">

      <div class="brand-logo-circle">
        <img
          src="https://i.ibb.co/NntMjTNW/IMG-4129.png"
          alt="REBAR IT Logo"
        >
      </div>

      <div class="brand-info">
        <div class="brand-name">
          <span class="rebar">REBAR</span>
          <span class="it">IT</span>
        </div>

        <div class="brand-subtitle">
          SECURE ACCESS
        </div>
      </div>

    </div>

    <div class="admin-status">

      <div class="admin-mini-shield">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L20 5V10.5C20 16 16.7 20.3 12 22C7.3 20.3 4 16 4 10.5V5L12 2ZM10.8 14.9L16.1 9.6L14.7 8.2L10.8 12.1L9 10.3L7.6 11.7Z"/>
        </svg>
      </div>

      <span id="modeLabel">Admin</span>
      <span class="online-dot"></span>

    </div>

  </header>


  <!-- PUBLIC -->

  <section id="publicView" class="card hidden">

    <div class="public-head">
      <h1><span>REBAR</span> IT</h1>
      <p>PROTECTED INFORMATION</p>
    </div>

    <div id="publicError" class="login-area hidden">

      <div class="security-logo">
        <svg viewBox="0 0 24 24">
          <path fill="#078fd1" d="M12 2L20 5V10.5C20 16 16.7 20.3 12 22C7.3 20.3 4 16 4 10.5V5L12 2Z"/>
        </svg>
      </div>

      <h2 class="login-title">بەردەست نییە</h2>

      <p id="publicErrorText" class="login-description"></p>

    </div>


    <div id="publicContent" class="content hidden">

      <div class="credential">
        <small>ئیمەیڵ</small>

        <div class="credential-row">
          <input id="displayEmail" readonly>

          <button
            class="copy-button"
            onclick="copyFrom('displayEmail',this)"
          >
            کۆپی
          </button>
        </div>
      </div>


      <div class="credential">
        <small>پاسۆرد</small>

        <div class="credential-row">
          <input id="displayPassword" readonly>

          <button
            class="copy-button"
            onclick="copyFrom('displayPassword',this)"
          >
            کۆپی
          </button>
        </div>
      </div>


      <a
        id="btnGetCode"
        class="button primary wide"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        بەدەستهێنانی کۆد
      </a>


      <div id="publicNote" class="note hidden"></div>


      <div class="record-status">
        <span>
          <i class="active-dot"></i>
          Active
        </span>

        <span id="usedAt"></span>
      </div>

    </div>

  </section>


  <!-- LOGIN -->

  <section id="loginView" class="card hidden">

    <div class="login-area">

      <div class="security-logo">

        <svg viewBox="0 0 24 24">
          <path
            fill="#078fd1"
            d="M12 2L20 5V10.5C20 16 16.7 20.3 12 22C7.3 20.3 4 16 4 10.5V5L12 2ZM10.7 15.4L16.4 9.7L14.9 8.2L10.7 12.4L8.9 10.6L7.4 12.1Z"
          />
        </svg>

      </div>

      <h2 class="login-title">
        بەشی بەڕێوەبەر
      </h2>

      <p class="login-description">
        بۆ پاراستنی زانیارییەکان، تەنها بە پاسۆردی بەڕێوەبەر دەتوانرێت بچیتە ژوورەوە.
      </p>

      <div class="field">
        <label>پاسۆردی بەڕێوەبەر</label>

        <input
          id="adminPassword"
          type="password"
          placeholder="••••••••"
        >
      </div>

      <button
        class="primary wide"
        onclick="adminLogin()"
      >
        چوونەژوورەوە
      </button>

      <div id="loginMsg" class="notice"></div>

    </div>

  </section>


  <!-- ADMIN -->

  <section id="adminView" class="card hidden">

    <div class="admin-header">
      <h1>بەڕێوەبردنی لینکەکان</h1>

      <p>
        لینک دروست بکە، زانیارییەکان دەستکاری بکە و لینکەکان بەڕێوەببە.
      </p>
    </div>


    <div class="tabs">

      <button
        id="tabCreate"
        class="tab active"
        onclick="switchTab('create')"
      >
        لینکی نوێ
      </button>

      <button
        id="tabEdit"
        class="tab"
        onclick="switchTab('edit')"
      >
        دەستکاری
      </button>

      <button
        class="tab"
        onclick="logout()"
      >
        چوونەدەرەوە
      </button>

    </div>


    <!-- CREATE -->

    <div id="createView" class="content">

      <div class="grid">

        <div class="field">
          <label>ئیمەیڵ</label>

          <input
            id="cEmail"
            class="ltr"
            placeholder="example@email.com"
          >
        </div>


        <div class="field">
          <label>پاسۆرد</label>

          <input
            id="cPassword"
            class="ltr"
            placeholder="Password"
          >
        </div>


        <div class="field full">
          <label>لینک</label>

          <input
            id="cTargetLink"
            class="ltr"
            placeholder="https://..."
          >
        </div>


        <div class="field full">
          <label>تێبینی</label>

          <textarea
            id="cNote"
            placeholder="تێبینی..."
          ></textarea>
        </div>

      </div>


      <button
        class="primary wide"
        style="margin-top:16px"
        onclick="createRecord()"
      >
        دروستکردنی لینک
      </button>


      <div id="createMsg" class="notice"></div>


      <div id="createResult" class="result">

        <code id="generatedLink"></code>

        <div class="button-row">

          <button
            class="secondary"
            onclick="copyGenerated()"
          >
            کۆپی لینک
          </button>

          <button
            class="secondary"
            onclick="openGenerated()"
          >
            کردنەوە
          </button>

        </div>

      </div>

    </div>


    <!-- EDIT -->

    <div id="editView" class="content hidden">

      <div class="field">

        <label>ID ی لینک</label>

        <div style="display:flex;gap:8px">

          <input
            id="editId"
            class="ltr"
            placeholder="ID"
          >

          <button
            class="secondary"
            onclick="loadRecordForEdit()"
          >
            بارکردن
          </button>

        </div>

      </div>


      <div id="editFields" class="hidden">

        <div class="grid">

          <div class="field">
            <label>ئیمەیڵ</label>
            <input id="eEmail" class="ltr">
          </div>

          <div class="field">
            <label>پاسۆرد</label>
            <input id="ePassword" class="ltr">
          </div>

          <div class="field full">
            <label>لینک</label>
            <input id="eTargetLink" class="ltr">
          </div>

          <div class="field full">
            <label>تێبینی</label>
            <textarea id="eNote"></textarea>
          </div>

        </div>


        <div class="button-row">

          <button
            class="primary"
            style="flex:1"
            onclick="saveRecord()"
          >
            پاشەکەوتکردن
          </button>

          <button
            class="danger"
            onclick="deleteRecord()"
          >
            سڕینەوە
          </button>

        </div>

      </div>


      <div id="editMsg" class="notice"></div>

    </div>

  </section>

</div>


<script>

  const API_BASE =
    "https://rebarit-secure-api.rebar4qwrna.workers.dev";

  const ADMIN_TOKEN_KEY =
    "rebarit_admin_session";

  let currentPublicId = "";
  let createdUrl = "";

  const $ = id =>
    document.getElementById(id);


  function showOnly(id){

    [
      "publicView",
      "loginView",
      "adminView"

    ].forEach(item=>{
      $(item).classList.add("hidden");
    });

    $(id).classList.remove("hidden");
  }


  function setNotice(id,text,success=false){

    const el = $(id);

    el.textContent = text;

    el.className =
      "notice " +
      (success ? "ok" : "err");
  }


  function clearNotice(id){

    $(id).textContent = "";
    $(id).className = "notice";
  }


  function authHeaders(){

    return{
      "Content-Type":"application/json",

      "Authorization":
        "Bearer " +
        (
          sessionStorage.getItem(
            ADMIN_TOKEN_KEY
          ) || ""
        )
    };
  }


  function cleanId(raw){

    const value =
      (raw || "").trim();

    const match =
      value.match(
        /[?&]id=([A-Za-z0-9_-]+)/
      );

    return match
      ? match[1]
      : value.replace(
          /[^A-Za-z0-9_-]/g,
          ""
        );
  }


  window.addEventListener(
    "DOMContentLoaded",
    async ()=>{

      const params =
        new URLSearchParams(
          location.search
        );

      currentPublicId =
        params.get("id") || "";

      if(currentPublicId){

        $("modeLabel").textContent =
          "Public";

        showOnly(
          "publicView"
        );

        await loadPublicRecord();

      }else{

        $("modeLabel").textContent =
          "Admin";

        const token =
          sessionStorage.getItem(
            ADMIN_TOKEN_KEY
          );

        if(token){
          showOnly("adminView");
        }else{
          showOnly("loginView");
        }
      }
    }
  );


  async function adminLogin(){

    clearNotice("loginMsg");

    const password =
      $("adminPassword").value;

    if(!password){

      setNotice(
        "loginMsg",
        "تکایە پاسۆرد بنووسە."
      );

      return;
    }

    try{

      const response =
        await fetch(
          API_BASE + "/api/login",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                password
              })
          }
        );

      const data =
        await response.json();

      if(!response.ok){

        throw new Error(
          data.error ||
          "Login failed"
        );
      }

      sessionStorage.setItem(
        ADMIN_TOKEN_KEY,
        data.token
      );

      $("adminPassword").value = "";

      showOnly("adminView");

    }catch(error){

      setNotice(
        "loginMsg",
        "پاسۆرد هەڵەیە یان پەیوەندی بە سێرڤەرەوە نییە."
      );
    }
  }


  function logout(){

    sessionStorage.removeItem(
      ADMIN_TOKEN_KEY
    );

    location.reload();
  }


  function switchTab(name){

    $("tabCreate")
      .classList
      .toggle(
        "active",
        name === "create"
      );

    $("tabEdit")
      .classList
      .toggle(
        "active",
        name === "edit"
      );

    $("createView")
      .classList
      .toggle(
        "hidden",
        name !== "create"
      );

    $("editView")
      .classList
      .toggle(
        "hidden",
        name !== "edit"
      );
  }


  function getFormData(prefix){

    return{
      email:
        $(prefix + "Email")
          .value
          .trim(),

      password:
        $(prefix + "Password")
          .value
          .trim(),

      targetLink:
        $(prefix + "TargetLink")
          .value
          .trim(),

      note:
        $(prefix + "Note")
          .value
          .trim()
    };
  }


  async function createRecord(){

    clearNotice("createMsg");

    $("createResult")
      .style
      .display = "none";

    const payload =
      getFormData("c");


    /*
      PIN نییە.
      Expiry نییە.
    */

    payload.viewerPin = "";
    payload.expiryHours = 0;


    if(
      !payload.email &&
      !payload.password
    ){

      setNotice(
        "createMsg",
        "لایەنی کەم ئیمەیڵ یان پاسۆرد بنووسە."
      );

      return;
    }


    try{

      const response =
        await fetch(
          API_BASE +
          "/api/records",
          {
            method:"POST",

            headers:
              authHeaders(),

            body:
              JSON.stringify(
                payload
              )
          }
        );


      const data =
        await response.json();


      if(response.status === 401){

        logout();
        return;
      }


      if(!response.ok){

        throw new Error(
          data.error ||
          "Create failed"
        );
      }


      createdUrl =
        location.origin +
        location.pathname +
        "?id=" +
        encodeURIComponent(
          data.id
        );


      $("generatedLink")
        .textContent =
        createdUrl;


      $("createResult")
        .style
        .display =
        "block";


      setNotice(
        "createMsg",
        "لینکەکە بە سەرکەوتوویی دروست کرا.",
        true
      );

    }catch(error){

      setNotice(
        "createMsg",
        error.message ||
        "هەڵەیەک ڕوویدا."
      );
    }
  }


  async function loadRecordForEdit(){

    clearNotice("editMsg");

    const id =
      cleanId(
        $("editId").value
      );

    $("editId").value = id;


    if(!id){

      setNotice(
        "editMsg",
        "ID بنووسە."
      );

      return;
    }


    try{

      const response =
        await fetch(
          API_BASE +
          "/api/admin/record/" +
          encodeURIComponent(id),
          {
            headers:
              authHeaders()
          }
        );


      const data =
        await response.json();


      if(response.status === 401){

        logout();
        return;
      }


      if(!response.ok){

        throw new Error(
          data.error ||
          "Record not found"
        );
      }


      $("eEmail").value =
        data.record.email || "";

      $("ePassword").value =
        data.record.password || "";

      $("eTargetLink").value =
        data.record.targetLink || "";

      $("eNote").value =
        data.record.note || "";


      $("editFields")
        .classList
        .remove("hidden");


      setNotice(
        "editMsg",
        "زانیارییەکان بارکران.",
        true
      );

    }catch(error){

      $("editFields")
        .classList
        .add("hidden");

      setNotice(
        "editMsg",
        error.message ||
        "زانیارییەکە نەدۆزرایەوە."
      );
    }
  }


  async function saveRecord(){

    clearNotice("editMsg");

    const id =
      cleanId(
        $("editId").value
      );

    const payload =
      getFormData("e");


    /*
      PIN و Expiry ـی record ـی کۆنیش
      پاک دەکرێنەوە.
    */

    payload.viewerPin = "";
    payload.expiryHours = 0;


    try{

      const response =
        await fetch(
          API_BASE +
          "/api/record/" +
          encodeURIComponent(id),
          {
            method:"PUT",

            headers:
              authHeaders(),

            body:
              JSON.stringify(
                payload
              )
          }
        );


      const data =
        await response.json();


      if(response.status === 401){

        logout();
        return;
      }


      if(!response.ok){

        throw new Error(
          data.error ||
          "Update failed"
        );
      }


      setNotice(
        "editMsg",
        "گۆڕانکارییەکان پاشەکەوت کران.",
        true
      );

    }catch(error){

      setNotice(
        "editMsg",
        error.message ||
        "هەڵەیەک ڕوویدا."
      );
    }
  }


  async function deleteRecord(){

    const id =
      cleanId(
        $("editId").value
      );

    if(!id){
      return;
    }


    if(
      !confirm(
        "دڵنیایت دەتەوێت ئەم لینکە بسڕیتەوە؟"
      )
    ){
      return;
    }


    try{

      const response =
        await fetch(
          API_BASE +
          "/api/record/" +
          encodeURIComponent(id),
          {
            method:"DELETE",

            headers:
              authHeaders()
          }
        );


      const data =
        await response.json();


      if(response.status === 401){

        logout();
        return;
      }


      if(!response.ok){

        throw new Error(
          data.error ||
          "Delete failed"
        );
      }


      $("editFields")
        .classList
        .add("hidden");


      setNotice(
        "editMsg",
        "لینکەکە سڕایەوە.",
        true
      );

    }catch(error){

      setNotice(
        "editMsg",
        error.message ||
        "هەڵەیەک ڕوویدا."
      );
    }
  }


  async function loadPublicRecord(){

    try{

      const response =
        await fetch(
          API_BASE +
          "/api/record/" +
          encodeURIComponent(
            currentPublicId
          )
        );


      const data =
        await response.json();


      if(response.status === 404){

        throw new Error(
          "ئەم لینکە نەدۆزرایەوە."
        );
      }


      if(!response.ok){

        throw new Error(
          data.error ||
          "هەڵەیەک ڕوویدا."
        );
      }


      /*
        ئەگەر لینکێکی کۆن PIN هەبێت:
        لە Admin > دەستکاری
        باریکە و Save بکە.
      */

      if(data.requiresPin){

        throw new Error(
          "ئەم لینکە کۆنە هێشتا PIN ـی پێشوو هەیە. لە بەشی دەستکاری باریکە و جارێک پاشەکەوتی بکەوە."
        );
      }


      renderPublic(
        data.record
      );

    }catch(error){

      $("publicContent")
        .classList
        .add("hidden");

      $("publicError")
        .classList
        .remove("hidden");

      $("publicErrorText")
        .textContent =
        error.message;
    }
  }


  function renderPublic(record){

    $("publicError")
      .classList
      .add("hidden");

    $("publicContent")
      .classList
      .remove("hidden");


    $("displayEmail").value =
      record.email || "";

    $("displayPassword").value =
      record.password || "";

    $("btnGetCode").href =
      record.targetLink || "#";


    if(record.note){

      $("publicNote").textContent =
        record.note;

      $("publicNote")
        .classList
        .remove("hidden");

    }else{

      $("publicNote")
        .classList
        .add("hidden");
    }


    $("usedAt").textContent =
      new Date()
        .toLocaleString();
  }


  async function copyFrom(id,button){

    await navigator
      .clipboard
      .writeText(
        $(id).value
      );

    const old =
      button.textContent;

    button.textContent =
      "کۆپی کرا";

    setTimeout(
      ()=>{
        button.textContent = old;
      },
      1100
    );
  }


  async function copyGenerated(){

    await navigator
      .clipboard
      .writeText(
        createdUrl
      );
  }


  function openGenerated(){

    if(!createdUrl){
      return;
    }

    window.open(
      createdUrl,
      "_blank",
      "noopener"
    );
  }

</script>
