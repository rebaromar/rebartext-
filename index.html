<!DOCTYPE html>
<html lang="ckb" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f4f8fb"
  >

  <title>REBAR IT</title>

  <style>

    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&family=Inter:wght@700;800;900&display=swap');

    :root{
      --blue:#078fd1;
      --cyan:#37bef0;
      --text:#0f172a;
      --muted:#64748b;
      --line:#dce6ee;
      --green:#16a66a;
      --red:#d94b5c;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      min-height:100%;
    }

    body{
      font-family:
        "Noto Sans Arabic",
        Tahoma,
        Arial,
        sans-serif;

      color:var(--text);

      background:
        radial-gradient(
          circle at 12% 0%,
          rgba(55,190,240,.14),
          transparent 28%
        ),
        linear-gradient(
          180deg,
          #fbfdff,
          #eef4f8
        );

      padding:
        0 12px 34px;

      -webkit-font-smoothing:
        antialiased;
    }

    .hidden{
      display:none !important;
    }

    .shell{
      width:100%;
      max-width:980px;
      margin:auto;
    }


    /* =========================
       TOP BAR
    ========================= */

    .topbar{
      direction:ltr;

      display:flex;

      align-items:center;

      justify-content:
        space-between;

      gap:14px;

      min-height:106px;

      padding:
        14px 0;
    }

    .brand{
      display:flex;

      align-items:center;

      gap:12px;

      min-width:0;
    }

    .logo{
      width:78px;
      height:78px;

      flex:
        0 0 78px;

      border-radius:50%;

      overflow:hidden;

      background:#02070d;

      border:
        2px solid #fff;

      box-shadow:
        0 0 0 2px
        rgba(7,143,209,.22),

        0 10px 24px
        rgba(15,23,42,.14);
    }

    .logo img{
      width:100%;
      height:100%;

      object-fit:contain;

      padding:5px;
    }

    .brand-text{
      text-align:left;

      direction:ltr;
    }

    .brand-name{
      font-family:
        Inter,
        Arial,
        sans-serif;

      font-size:27px;

      font-weight:900;

      line-height:1;
    }

    .brand-name .rebar{
      color:var(--blue);
    }

    .brand-name .it{
      margin-left:6px;
    }

    .brand-sub{
      margin-top:6px;

      color:#718096;

      font:
        800 9px/1.2
        Inter,
        Arial,
        sans-serif;

      letter-spacing:1px;
    }

    .status{
      direction:ltr;

      display:flex;

      align-items:center;

      gap:7px;

      padding:
        8px 11px;

      border:
        1px solid #dce6ee;

      border-radius:999px;

      background:#fff;

      box-shadow:
        0 7px 18px
        rgba(15,23,42,.05);

      font:
        800 9px/1
        Inter,
        Arial,
        sans-serif;
    }

    .dot{
      width:7px;
      height:7px;

      border-radius:50%;

      background:#22b873;

      box-shadow:
        0 0 0 3px
        rgba(34,184,115,.12);
    }


    /* =========================
       CARD
    ========================= */

    .card{
      background:#fff;

      border:
        1px solid #dce6ee;

      border-radius:24px;

      overflow:hidden;

      box-shadow:
        0 20px 55px
        rgba(15,23,42,.08);
    }

    .card:before{
      content:"";

      display:block;

      height:4px;

      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--cyan),
          #8be5ff
        );
    }


    /* =========================
       PUBLIC HEADER
    ========================= */

    .public-head{
      text-align:center;

      padding:
        28px 20px 20px;

      border-bottom:
        1px solid #edf2f5;

      background:
        linear-gradient(
          180deg,
          #fff,
          #f9fcfd
        );
    }

    .public-head h1{
      margin:0;

      direction:ltr;

      font:
        900 30px/1.2
        Inter,
        Arial,
        sans-serif;
    }

    .public-head h1 span{
      color:var(--blue);
    }

    .public-head p{
      margin:
        8px 0 0;

      color:#7b8a9b;

      font:
        800 10px/1.4
        Inter,
        Arial,
        sans-serif;

      letter-spacing:.8px;
    }


    /* =========================
       PUBLIC CONTENT
    ========================= */

    .content{
      padding:24px;
    }

    .credential{
      margin-bottom:12px;

      padding:
        13px 14px;

      border:
        1px solid #dce4eb;

      border-radius:16px;

      background:
        linear-gradient(
          180deg,
          #fbfcfd,
          #f7f9fb
        );
    }

    .credential small{
      display:block;

      margin-bottom:6px;

      color:#77879a;

      font-size:11px;

      font-weight:800;
    }

    .credential-row{
      display:flex;

      align-items:center;

      gap:9px;
    }

    .credential input{
      flex:1;

      min-width:0;

      border:0;

      outline:0;

      background:
        transparent;

      color:#111827;

      direction:ltr;

      text-align:left;

      font:
        800 14px/1.8
        Inter,
        Arial,
        sans-serif;
    }


    /* =========================
       BUTTONS
    ========================= */

    button,
    .button{
      appearance:none;

      border:0;

      cursor:pointer;

      min-height:50px;

      padding:
        11px 17px;

      border-radius:15px;

      display:inline-flex;

      align-items:center;

      justify-content:center;

      text-decoration:none;

      font-size:13px;

      font-weight:900;

      font-family:inherit;

      transition:
        .14s ease;

      touch-action:
        manipulation;
    }

    .primary{
      color:#fff;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--cyan)
        );

      box-shadow:
        0 11px 24px
        rgba(7,143,209,.20);
    }

    .primary:active{
      transform:
        scale(.985);
    }

    .secondary{
      color:#334155;

      background:#f7f9fb;

      border:
        1px solid #dae3ea;
    }

    .danger{
      color:#b3263b;

      background:#fff3f5;

      border:
        1px solid #f4cad1;
    }

    .wide{
      width:100%;
    }


    /* =========================
       COPY BUTTON
    ========================= */

    .copy-button{
      min-width:
        80px !important;

      min-height:
        44px !important;

      height:
        44px !important;

      padding:
        0 16px !important;

      border:
        1px solid
        #cfdbe5 !important;

      border-radius:
        13px !important;

      background:
        #fff !important;

      color:
        #334155 !important;

      box-shadow:
        0 4px 12px
        rgba(15,23,42,.07)
        !important;

      font-size:
        12px !important;

      font-weight:
        800 !important;

      -webkit-tap-highlight-color:
        transparent;

      user-select:none;
    }

    .copy-button:active{
      transform:
        scale(.95);
    }

    .copy-button.copied{
      color:
        #0d784f !important;

      background:
        #eefbf4 !important;

      border-color:
        #b9e6cd !important;
    }


    /* =========================
       INLINE CODE WINDOW
    ========================= */

    .inline-code-box{
      display:none;

      margin-top:16px;

      border:
        1px solid #d7e2ea;

      border-radius:18px;

      overflow:hidden;

      background:#fff;

      box-shadow:
        0 10px 26px
        rgba(15,23,42,.08);
    }

    .inline-code-title{
      padding:
        14px 16px;

      text-align:center;

      font-size:16px;

      font-weight:900;

      color:#111827;

      background:
        linear-gradient(
          180deg,
          #fbfdff,
          #f4f8fb
        );

      border-bottom:
        1px solid #e5ebf0;
    }

    .inline-loading{
      padding:16px;

      text-align:center;

      color:#718096;

      font-size:12px;

      font-weight:700;

      background:#fff;
    }

    .inline-code-frame{
      width:100%;

      height:560px;

      border:0;

      display:block;

      background:#fff;
    }

    .inline-close{
      width:100%;

      border-radius:0;

      min-height:44px;

      color:#64748b;

      background:#f8fafc;

      border-top:
        1px solid #e5ebf0;

      box-shadow:none;

      font-size:11px;
    }


    /* =========================
       NOTE / STATUS
    ========================= */

    .note{
      margin-top:14px;

      padding:14px;

      border:
        1px solid #dce4eb;

      border-radius:15px;

      background:#fafcfd;

      color:#405065;

      font-size:12px;

      line-height:2;

      white-space:
        pre-wrap;
    }

    .record-status{
      display:flex;

      justify-content:
        space-between;

      gap:12px;

      margin-top:17px;

      padding-top:14px;

      border-top:
        1px solid #edf1f4;

      color:#8693a3;

      font:
        700 10px/1.6
        Inter,
        Arial,
        sans-serif;
    }

    .active-dot{
      display:inline-block;

      width:8px;
      height:8px;

      margin-left:6px;

      border-radius:50%;

      background:
        var(--green);
    }


    /* =========================
       LOGIN
    ========================= */

    .login-area{
      max-width:560px;

      margin:auto;

      padding:
        38px 24px;
    }

    .security-logo{
      width:76px;
      height:76px;

      margin:
        0 auto 17px;

      border-radius:23px;

      display:grid;

      place-items:center;

      background:
        linear-gradient(
          145deg,
          #f6fcff,
          #eaf8fd
        );

      border:
        1px solid #cde8f4;
    }

    .security-logo svg{
      width:40px;
      height:40px;
    }

    .login-title{
      margin:
        0 0 8px;

      text-align:center;

      font-size:25px;

      font-weight:900;
    }

    .login-description{
      margin:
        0 auto 22px;

      text-align:center;

      color:#607086;

      font-size:13px;

      line-height:2;
    }


    /* =========================
       FORM
    ========================= */

    .field{
      margin-bottom:14px;
    }

    .field label{
      display:block;

      margin:
        0 4px 8px;

      color:#27364a;

      font-size:13px;

      font-weight:800;
    }

    .field input,
    .field textarea{
      width:100%;

      min-height:54px;

      padding:
        12px 14px;

      border:
        1px solid #d5dfe7;

      border-radius:15px;

      outline:0;

      background:#fbfdfe;

      color:#111827;

      font-size:14px;

      font-family:inherit;
    }

    .field textarea{
      min-height:110px;

      resize:vertical;

      line-height:2;
    }

    .field input:focus,
    .field textarea:focus{
      background:#fff;

      border-color:#50bce8;

      box-shadow:
        0 0 0 4px
        rgba(7,143,209,.08);
    }

    .ltr{
      direction:ltr;

      text-align:left;

      font-family:
        Inter,
        Arial,
        sans-serif;
    }


    /* =========================
       ADMIN
    ========================= */

    .admin-header{
      padding:
        23px 24px 17px;

      border-bottom:
        1px solid #edf1f4;
    }

    .admin-header h1{
      margin:0;

      font-size:23px;
    }

    .admin-header p{
      margin:
        5px 0 0;

      color:#6b7c90;

      font-size:12px;
    }

    .tabs{
      display:grid;

      grid-template-columns:
        1fr 1fr 1fr;

      gap:8px;

      padding:
        12px 16px;

      background:#f8fafc;

      border-bottom:
        1px solid #edf1f4;
    }

    .tab{
      min-height:44px;

      background:#fff;

      color:#627287;

      border:
        1px solid #dbe3e9;

      border-radius:13px;

      font-size:10.5px;
    }

    .tab.active{
      color:#fff;

      background:
        linear-gradient(
          135deg,
          #0c1b2b,
          #193b56
        );
    }

    .grid{
      display:grid;

      grid-template-columns:
        1fr 1fr;

      gap:14px;
    }

    .full{
      grid-column:
        1/-1;
    }

    .button-row{
      display:flex;

      gap:9px;

      flex-wrap:wrap;

      margin-top:16px;
    }

    .notice{
      display:none;

      margin-top:13px;

      padding:
        11px 13px;

      border-radius:13px;

      font-size:12px;

      line-height:1.9;
    }

    .notice.ok{
      display:block;

      color:#0d784f;

      background:#eefbf4;

      border:
        1px solid #bbe8cf;
    }

    .notice.err{
      display:block;

      color:#b2293d;

      background:#fff3f5;

      border:
        1px solid #f4c8cf;
    }

    .result{
      display:none;

      margin-top:15px;

      padding:14px;

      border:
        1px dashed #9ddaf1;

      border-radius:15px;

      background:#f3fbff;
    }

    .result code{
      display:block;

      direction:ltr;

      text-align:left;

      word-break:
        break-all;

      color:#075985;

      font:
        700 12px/1.8
        Inter,
        Arial,
        sans-serif;
    }


    /* =========================
       MOBILE
    ========================= */

    @media(
      max-width:650px
    ){

      body{
        padding:
          0 9px 26px;
      }

      .topbar{
        min-height:88px;
      }

      .logo{
        width:62px;

        height:62px;

        flex-basis:62px;
      }

      .brand-name{
        font-size:19px;
      }

      .brand-sub{
        display:none;
      }

      .status{
        font-size:8px;

        padding:
          7px 9px;
      }

      .card{
        border-radius:21px;
      }

      .content{
        padding:
          19px 15px 23px;
      }

      .login-area{
        padding:
          31px 17px 27px;
      }

      .grid{
        grid-template-columns:
          1fr;
      }

      .full{
        grid-column:auto;
      }

      .public-head h1{
        font-size:26px;
      }

      .copy-button{
        min-width:
          76px !important;
      }

      .inline-code-frame{
        height:600px;
      }
    }

  </style>

</head>


<body>

<div class="shell">


  <!-- =========================
       TOP BAR
  ========================== -->

  <header class="topbar">

    <div class="brand">

      <div class="logo">

        <img
          src="https://i.ibb.co/NntMjTNW/IMG-4129.png"
          alt="REBAR IT Logo"
        >

      </div>

      <div class="brand-text">

        <div class="brand-name">

          <span class="rebar">
            REBAR
          </span>

          <span class="it">
            IT
          </span>

        </div>

        <div class="brand-sub">
          SECURE ACCESS
        </div>

      </div>

    </div>


    <div class="status">

      <span id="modeLabel">
        Admin
      </span>

      <span class="dot"></span>

    </div>

  </header>



  <!-- =========================
       PUBLIC VIEW
  ========================== -->

  <section
    id="publicView"
    class="card hidden"
  >


    <div class="public-head">

      <h1>
        <span>APPLE</span>
        ID
      </h1>

      <p>
        INFORMATION
      </p>

    </div>



    <div
      id="publicError"
      class="login-area hidden"
    >

      <div class="security-logo">

        <svg viewBox="0 0 24 24">

          <path
            fill="#078fd1"
            d="M12 2L20 5V10.5C20 16 16.7 20.3 12 22C7.3 20.3 4 16 4 10.5V5L12 2Z"
          />

        </svg>

      </div>

      <h2 class="login-title">
        بەردەست نییە
      </h2>

      <p
        id="publicErrorText"
        class="login-description"
      ></p>

    </div>



    <div
      id="publicContent"
      class="content hidden"
    >


      <!-- EMAIL -->

      <div class="credential">

        <small>
          ئیمەیڵ
        </small>

        <div class="credential-row">

          <input
            id="displayEmail"
            readonly
          >

          <button
            class="copy-button"
            onclick="copyFrom('displayEmail',this)"
          >
            کۆپی
          </button>

        </div>

      </div>



      <!-- PASSWORD -->

      <div class="credential">

        <small>
          پاسۆرد
        </small>

        <div class="credential-row">

          <input
            id="displayPassword"
            readonly
          >

          <button
            class="copy-button"
            onclick="copyFrom('displayPassword',this)"
          >
            کۆپی
          </button>

        </div>

      </div>



      <!-- GET CODE -->

      <button
        id="btnGetCode"
        class="primary wide"
        type="button"
        onclick="openCodeInside()"
      >
        بەدەستهێنانی کۆد
      </button>



      <!-- INLINE LINK WINDOW -->

      <div
        id="inlineCodeBox"
        class="inline-code-box"
      >

        <div class="inline-code-title">
          کۆدی چوونەژوورەوە
        </div>

        <div
          id="inlineLoading"
          class="inline-loading"
        >
          چاوەڕێ بکە...
        </div>

        <iframe
          id="inlineCodeFrame"
          class="inline-code-frame"
          src="about:blank"
          referrerpolicy="no-referrer"
          onload="inlineFrameLoaded()"
        ></iframe>

        <button
          type="button"
          class="inline-close"
          onclick="closeCodeInside()"
        >
          داخستن
        </button>

      </div>



      <!-- NOTE -->

      <div
        id="publicNote"
        class="note hidden"
      ></div>



      <!-- STATUS -->

      <div class="record-status">

        <span>

          <i class="active-dot"></i>

          Active

        </span>

        <span id="usedAt"></span>

      </div>


    </div>

  </section>



  <!-- =========================
       LOGIN VIEW
  ========================== -->

  <section
    id="loginView"
    class="card hidden"
  >

    <div class="login-area">

      <div class="security-logo">

        <svg viewBox="0 0 24 24">

          <path
            fill="#078fd1"
            d="M12 2L20 5V10.5C20 16 16.7 20.3 12 22C7.3 20.3 4 16 4 10.5V5L12 2ZM10.7 15.4L16.4 9.7L14.9 8.2L10.7 12.4L8.9 10.6L7.4 12.1L10.7 15.4Z"
          />

        </svg>

      </div>


      <h2 class="login-title">
        بەشی بەڕێوەبەر
      </h2>


      <p class="login-description">

        بۆ پاراستنی زانیارییەکان،
        تەنها بە پاسۆردی بەڕێوەبەر
        دەتوانرێت بچیتە ژوورەوە.

      </p>


      <div class="field">

        <label>
          پاسۆردی بەڕێوەبەر
        </label>

        <input
          id="adminPassword"
          type="password"
          autocomplete="current-password"
          placeholder="••••••••"
        >

      </div>


      <button
        class="primary wide"
        onclick="adminLogin()"
      >
        چوونەژوورەوە
      </button>


      <div
        id="loginMsg"
        class="notice"
      ></div>

    </div>

  </section>



  <!-- =========================
       ADMIN VIEW
  ========================== -->

  <section
    id="adminView"
    class="card hidden"
  >


    <div class="admin-header">

      <h1>
        بەڕێوەبردنی لینکەکان
      </h1>

      <p>
        لینک دروست بکە،
        دەستکاری بکە
        یان بسڕەوە.
      </p>

    </div>



    <div class="tabs">

      <button
        id="tabCreate"
        class="tab active"
        onclick="switchTab('create')"
      >
        لینکی نوێ
      </button>


      <button
        id="tabEdit"
        class="tab"
        onclick="switchTab('edit')"
      >
        دەستکاری
      </button>


      <button
        class="tab"
        onclick="logout()"
      >
        چوونەدەرەوە
      </button>

    </div>



    <!-- CREATE -->

    <div
      id="createView"
      class="content"
    >

      <div class="grid">


        <div class="field">

          <label>
            ئیمەیڵ
          </label>

          <input
            id="cEmail"
            class="ltr"
            placeholder="example@email.com"
          >

        </div>



        <div class="field">

          <label>
            پاسۆرد
          </label>

          <input
            id="cPassword"
            class="ltr"
            placeholder="Password"
          >

        </div>



        <div class="field full">

          <label>
            لینک
          </label>

          <input
            id="cTargetLink"
            class="ltr"
            placeholder="https://..."
          >

        </div>



        <div class="field full">

          <label>
            تێبینی
          </label>

          <textarea
            id="cNote"
            placeholder="تێبینی..."
          ></textarea>

        </div>

      </div>



      <button
        class="primary wide"
        style="margin-top:15px"
        onclick="createRecord()"
      >
        دروستکردنی لینک
      </button>



      <div
        id="createMsg"
        class="notice"
      ></div>



      <div
        id="createResult"
        class="result"
      >

        <code
          id="generatedLink"
        ></code>


        <div class="button-row">

          <button
            class="secondary"
            onclick="copyGenerated()"
          >
            کۆپی لینک
          </button>


          <button
            class="secondary"
            onclick="openGenerated()"
          >
            کردنەوە
          </button>

        </div>

      </div>

    </div>



    <!-- EDIT -->

    <div
      id="editView"
      class="content hidden"
    >

      <div class="field">

        <label>
          ID ی لینک
        </label>

        <div
          style="
            display:flex;
            gap:8px;
          "
        >

          <input
            id="editId"
            class="ltr"
            placeholder="ID"
          >


          <button
            class="secondary"
            onclick="loadRecordForEdit()"
          >
            بارکردن
          </button>

        </div>

      </div>



      <div
        id="editFields"
        class="hidden"
      >


        <div class="grid">


          <div class="field">

            <label>
              ئیمەیڵ
            </label>

            <input
              id="eEmail"
              class="ltr"
            >

          </div>



          <div class="field">

            <label>
              پاسۆرد
            </label>

            <input
              id="ePassword"
              class="ltr"
            >

          </div>



          <div class="field full">

            <label>
              لینک
            </label>

            <input
              id="eTargetLink"
              class="ltr"
            >

          </div>



          <div class="field full">

            <label>
              تێبینی
            </label>

            <textarea
              id="eNote"
            ></textarea>

          </div>

        </div>



        <div class="button-row">

          <button
            class="primary"
            style="flex:1"
            onclick="saveRecord()"
          >
            پاشەکەوتکردن
          </button>


          <button
            class="danger"
            onclick="deleteRecord()"
          >
            سڕینەوە
          </button>

        </div>

      </div>



      <div
        id="editMsg"
        class="notice"
      ></div>

    </div>

  </section>

</div>




<script>


  /* =========================
     API
  ========================= */

  const API_BASE =
    "https://rebarit-secure-api.rebar4qwrna.workers.dev";


  const ADMIN_TOKEN_KEY =
    "rebarit_admin_session";


  let currentPublicId = "";

  let createdUrl = "";

  let currentTargetLink = "";

  let copyAudioContext = null;


  const $ = id =>
    document.getElementById(id);



  /* =========================
     GENERAL
  ========================= */

  function showOnly(id){

    [
      "publicView",
      "loginView",
      "adminView"

    ].forEach(item=>{

      $(item)
        .classList
        .add("hidden");

    });


    $(id)
      .classList
      .remove("hidden");
  }



  function setNotice(
    id,
    text,
    ok=false
  ){

    const element =
      $(id);

    element.textContent =
      text;

    element.className =
      "notice " +
      (
        ok
          ? "ok"
          : "err"
      );
  }



  function clearNotice(id){

    const element =
      $(id);

    element.textContent =
      "";

    element.className =
      "notice";
  }



  function authHeaders(){

    return{

      "Content-Type":
        "application/json",

      "Authorization":
        "Bearer " +
        (
          sessionStorage
            .getItem(
              ADMIN_TOKEN_KEY
            ) || ""
        )

    };
  }



  function cleanId(raw){

    const value =
      (raw || "")
        .trim();


    const match =
      value.match(
        /[?&]id=([A-Za-z0-9_-]+)/
      );


    return match

      ? match[1]

      : value.replace(
          /[^A-Za-z0-9_-]/g,
          ""
        );
  }



  /* =========================
     START
  ========================= */

  window.addEventListener(
    "DOMContentLoaded",
    async()=>{

      currentPublicId =
        new URLSearchParams(
          location.search
        )
        .get("id") || "";


      if(currentPublicId){

        $("modeLabel")
          .textContent =
          "Public";


        showOnly(
          "publicView"
        );


        await loadPublicRecord();


      }else{

        $("modeLabel")
          .textContent =
          "Admin";


        if(
          sessionStorage
            .getItem(
              ADMIN_TOKEN_KEY
            )
        ){

          showOnly(
            "adminView"
          );

        }else{

          showOnly(
            "loginView"
          );

        }

      }

    }
  );



  /* =========================
     LOGIN
  ========================= */

  async function adminLogin(){

    clearNotice(
      "loginMsg"
    );


    const password =
      $("adminPassword")
        .value;


    if(!password){

      setNotice(
        "loginMsg",
        "تکایە پاسۆرد بنووسە."
      );

      return;
    }


    try{

      const response =
        await fetch(
          API_BASE +
          "/api/login",
          {

            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                password
              })

          }
        );


      const data =
        await response.json();


      if(!response.ok){

        throw new Error(
          data.error ||
          "Login failed"
        );

      }


      sessionStorage
        .setItem(
          ADMIN_TOKEN_KEY,
          data.token
        );


      $("adminPassword")
        .value =
        "";


      showOnly(
        "adminView"
      );


    }catch(error){

      setNotice(
        "loginMsg",
        "پاسۆرد هەڵەیە یان پەیوەندی بە سێرڤەرەوە نییە."
      );

    }

  }



  function logout(){

    sessionStorage
      .removeItem(
        ADMIN_TOKEN_KEY
      );


    location.reload();

  }



  /* =========================
     ADMIN TABS
  ========================= */

  function switchTab(name){

    $("tabCreate")
      .classList
      .toggle(
        "active",
        name === "create"
      );


    $("tabEdit")
      .classList
      .toggle(
        "active",
        name === "edit"
      );


    $("createView")
      .classList
      .toggle(
        "hidden",
        name !== "create"
      );


    $("editView")
      .classList
      .toggle(
        "hidden",
        name !== "edit"
      );

  }



  function getFormData(prefix){

    return{

      email:
        $(prefix + "Email")
          .value
          .trim(),

      password:
        $(prefix + "Password")
          .value
          .trim(),

      targetLink:
        $(prefix + "TargetLink")
          .value
          .trim(),

      note:
        $(prefix + "Note")
          .value
          .trim()

    };

  }



  /* =========================
     CREATE
  ========================= */

  async function createRecord(){

    clearNotice(
      "createMsg"
    );


    $("createResult")
      .style
      .display =
      "none";


    const payload =
      getFormData("c");


    if(
      !payload.email &&
      !payload.password
    ){

      setNotice(
        "createMsg",
        "لایەنی کەم ئیمەیڵ یان پاسۆرد بنووسە."
      );

      return;
    }


    try{

      const response =
        await fetch(
          API_BASE +
          "/api/records",
          {

            method:"POST",

            headers:
              authHeaders(),

            body:
              JSON.stringify(
                payload
              )

          }
        );


      const data =
        await response.json();


      if(
        response.status === 401
      ){

        logout();

        return;
      }


      if(!response.ok){

        throw new Error(
          data.error ||
          "Create failed"
        );

      }


      createdUrl =
        location.origin +
        location.pathname +
        "?id=" +
        encodeURIComponent(
          data.id
        );


      $("generatedLink")
        .textContent =
        createdUrl;


      $("createResult")
        .style
        .display =
        "block";


      setNotice(
        "createMsg",
        "لینکەکە بە سەرکەوتوویی دروست کرا.",
        true
      );


    }catch(error){

      setNotice(
        "createMsg",
        error.message ||
        "هەڵەیەک ڕوویدا."
      );

    }

  }



  /* =========================
     LOAD FOR EDIT
  ========================= */

  async function loadRecordForEdit(){

    clearNotice(
      "editMsg"
    );


    const id =
      cleanId(
        $("editId").value
      );


    $("editId").value =
      id;


    if(!id){

      setNotice(
        "editMsg",
        "ID بنووسە."
      );

      return;
    }


    try{

      const response =
        await fetch(
          API_BASE +
          "/api/admin/record/" +
          encodeURIComponent(id),
          {

            headers:
              authHeaders()

          }
        );


      const data =
        await response.json();


      if(
        response.status === 401
      ){

        logout();

        return;
      }


      if(!response.ok){

        throw new Error(
          data.error ||
          "Record not found"
        );

      }


      $("eEmail")
        .value =
        data.record.email || "";


      $("ePassword")
        .value =
        data.record.password || "";


      $("eTargetLink")
        .value =
        data.record.targetLink || "";


      $("eNote")
        .value =
        data.record.note || "";


      $("editFields")
        .classList
        .remove("hidden");


      setNotice(
        "editMsg",
        "زانیارییەکان بارکران.",
        true
      );


    }catch(error){

      $("editFields")
        .classList
        .add("hidden");


      setNotice(
        "editMsg",
        error.message ||
        "زانیارییەکە نەدۆزرایەوە."
      );

    }

  }



  /* =========================
     SAVE
  ========================= */

  async function saveRecord(){

    clearNotice(
      "editMsg"
    );


    const id =
      cleanId(
        $("editId").value
      );


    const payload =
      getFormData("e");


    try{

      const response =
        await fetch(
          API_BASE +
          "/api/record/" +
          encodeURIComponent(id),
          {

            method:"PUT",

            headers:
              authHeaders(),

            body:
              JSON.stringify(
                payload
              )

          }
        );


      const data =
        await response.json();


      if(
        response.status === 401
      ){

        logout();

        return;
      }


      if(!response.ok){

        throw new Error(
          data.error ||
          "Update failed"
        );

      }


      setNotice(
        "editMsg",
        "گۆڕانکارییەکان پاشەکەوت کران.",
        true
      );


    }catch(error){

      setNotice(
        "editMsg",
        error.message ||
        "هەڵەیەک ڕوویدا."
      );

    }

  }



  /* =========================
     DELETE
  ========================= */

  async function deleteRecord(){

    const id =
      cleanId(
        $("editId").value
      );


    if(!id){

      return;
    }


    if(
      !confirm(
        "دڵنیایت دەتەوێت ئەم لینکە بسڕیتەوە؟"
      )
    ){

      return;
    }


    try{

      const response =
        await fetch(
          API_BASE +
          "/api/record/" +
          encodeURIComponent(id),
          {

            method:"DELETE",

            headers:
              authHeaders()

          }
        );


      const data =
        await response.json();


      if(
        response.status === 401
      ){

        logout();

        return;
      }


      if(!response.ok){

        throw new Error(
          data.error ||
          "Delete failed"
        );

      }


      $("editFields")
        .classList
        .add("hidden");


      setNotice(
        "editMsg",
        "لینکەکە سڕایەوە.",
        true
      );


    }catch(error){

      setNotice(
        "editMsg",
        error.message ||
        "هەڵەیەک ڕوویدا."
      );

    }

  }



  /* =========================
     PUBLIC LOAD
  ========================= */

  async function loadPublicRecord(){

    try{

      const response =
        await fetch(
          API_BASE +
          "/api/record/" +
          encodeURIComponent(
            currentPublicId
          )
        );


      const data =
        await response.json();


      if(
        response.status === 404
      ){

        throw new Error(
          "ئەم لینکە نەدۆزرایەوە."
        );

      }


      if(!response.ok){

        throw new Error(
          data.error ||
          "هەڵەیەک ڕوویدا."
        );

      }


      renderPublic(
        data.record
      );


    }catch(error){

      $("publicContent")
        .classList
        .add("hidden");


      $("publicError")
        .classList
        .remove("hidden");


      $("publicErrorText")
        .textContent =
        error.message;

    }

  }



  /* =========================
     PUBLIC RENDER
  ========================= */

  function renderPublic(record){

    $("publicError")
      .classList
      .add("hidden");


    $("publicContent")
      .classList
      .remove("hidden");


    $("displayEmail")
      .value =
      record.email || "";


    $("displayPassword")
      .value =
      record.password || "";


    currentTargetLink =
      record.targetLink || "";


    if(currentTargetLink){

      $("btnGetCode")
        .style
        .display =
        "inline-flex";

    }else{

      $("btnGetCode")
        .style
        .display =
        "none";

    }


    if(record.note){

      $("publicNote")
        .textContent =
        record.note;


      $("publicNote")
        .classList
        .remove("hidden");

    }else{

      $("publicNote")
        .classList
        .add("hidden");

    }


    $("usedAt")
      .textContent =
      new Date()
        .toLocaleString();

  }



  /* =========================
     INLINE LINK
  ========================= */

  function openCodeInside(){

    if(!currentTargetLink){

      return;

    }


    const box =
      $("inlineCodeBox");


    const frame =
      $("inlineCodeFrame");


    const loading =
      $("inlineLoading");


    loading.style.display =
      "block";


    frame.style.display =
      "none";


    frame.src =
      currentTargetLink;


    box.style.display =
      "block";


    setTimeout(()=>{

      box.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

    },100);

  }



  function inlineFrameLoaded(){

    const frame =
      $("inlineCodeFrame");


    if(
      frame.src ===
      "about:blank"
    ){

      return;

    }


    $("inlineLoading")
      .style
      .display =
      "none";


    frame.style.display =
      "block";

  }



  function closeCodeInside(){

    const box =
      $("inlineCodeBox");


    const frame =
      $("inlineCodeFrame");


    frame.src =
      "about:blank";


    box.style.display =
      "none";

  }



  /* =========================
     COPY SOUND
  ========================= */

  function playCopySound(){

    try{

      const AudioClass =
        window.AudioContext ||
        window.webkitAudioContext;


      if(!AudioClass){

        return;
      }


      if(!copyAudioContext){

        copyAudioContext =
          new AudioClass();

      }


      if(
        copyAudioContext.state ===
        "suspended"
      ){

        copyAudioContext
          .resume();

      }


      const now =
        copyAudioContext
          .currentTime;


      const oscillator =
        copyAudioContext
          .createOscillator();


      const gain =
        copyAudioContext
          .createGain();


      oscillator.type =
        "sine";


      oscillator.frequency
        .setValueAtTime(
          760,
          now
        );


      oscillator.frequency
        .exponentialRampToValueAtTime(
          920,
          now + .045
        );


      gain.gain
        .setValueAtTime(
          .055,
          now
        );


      gain.gain
        .exponentialRampToValueAtTime(
          .001,
          now + .075
        );


      oscillator.connect(
        gain
      );


      gain.connect(
        copyAudioContext
          .destination
      );


      oscillator.start(
        now
      );


      oscillator.stop(
        now + .075
      );


    }catch(error){

    }

  }



  /* =========================
     COPY FUNCTION
  ========================= */

  async function writeClipboard(text){

    if(
      navigator.clipboard &&
      window.isSecureContext
    ){

      await navigator
        .clipboard
        .writeText(text);

      return;

    }


    const textarea =
      document
        .createElement(
          "textarea"
        );


    textarea.value =
      text;


    textarea
      .setAttribute(
        "readonly",
        ""
      );


    textarea.style.position =
      "fixed";


    textarea.style.opacity =
      "0";


    document.body
      .appendChild(
        textarea
      );


    textarea.select();


    textarea
      .setSelectionRange(
        0,
        textarea.value.length
      );


    document.execCommand(
      "copy"
    );


    textarea.remove();

  }



  async function copyFrom(
    id,
    button
  ){

    playCopySound();


    try{

      await writeClipboard(
        $(id).value || ""
      );


      const oldText =
        button.textContent;


      button.textContent =
        "کۆپی کرا";


      button.classList
        .add("copied");


      setTimeout(
        ()=>{

          button.textContent =
            oldText;


          button.classList
            .remove("copied");

        },
        1100
      );


    }catch(error){

      button.textContent =
        "هەڵە";


      setTimeout(
        ()=>{

          button.textContent =
            "کۆپی";

        },
        1100
      );

    }

  }



  async function copyGenerated(){

    playCopySound();


    try{

      await writeClipboard(
        createdUrl
      );

    }catch(error){

    }

  }



  function openGenerated(){

    if(createdUrl){

      window.open(
        createdUrl,
        "_blank",
        "noopener"
      );

    }

  }

</script>

<script>
window.openCodeInside = function () {

  if (
    typeof currentTargetLink === "undefined" ||
    !currentTargetLink ||
    currentTargetLink.trim() === ""
  ) {
    alert("هیچ لینکێک دانەنراوە.");
    return;
  }

  try {

    const url = new URL(currentTargetLink);

    if (
      url.protocol !== "https:" &&
      url.protocol !== "http:"
    ) {
      alert("لینکەکە دروست نییە.");
      return;
    }

    window.location.href = url.href;

  } catch (error) {

    alert("لینکەکە دروست نییە.");

  }

};
</script>
