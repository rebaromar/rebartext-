<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REBAR IT</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); box-sizing: border-box; }
        h2 { text-align: center; color: #0088cc; margin-top: 0; }
        textarea { width: 100%; height: 150px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; resize: vertical; }
        button { width: 100%; background: #0088cc; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #006699; }
        .result-box { margin-top: 15px; display: none; background: #eef9ff; padding: 10px; border-radius: 8px; border: 1px solid #bce8ff; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 8px; text-align: left; direction: ltr; font-size: 13px; }
        .copy-btn { background: #28a745; margin-top: 0; }
        .copy-btn:hover { background: #218838; }
        .loading { text-align: center; color: #666; font-size: 14px; margin-top: 10px; display: none; }
        
        #readView { display: none; }
        /* لێرەدا قەبارەی فۆنتەکە گەورەتر کراوە و تۆختر (Bold) کراوە */
        .text-content { background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #e0e0e0; white-space: pre-wrap; word-break: break-word; line-height: 1.6; font-size: 18px; font-weight: bold; color: #222; max-height: 400px; overflow-y: auto; text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <!-- بەشی دروستکردنی تێکست -->
    <div id="createView">
        <h2>REBAR IT</h2>
        <textarea id="textInput" placeholder="تێکستەکەت لێرە بنووسە..."></textarea>
        <button onclick="generateLink()">دروستکردنی لینک</button>
        <div class="loading" id="loadingText">چاوەڕێ بە، لینکەکە خەزن دەکرێت...</div>

        <div class="result-box" id="resultBox">
            <input type="text" id="generatedLink" readonly>
            <button class="copy-btn" onclick="copyLink()">کۆپیکردنی لینک</button>
        </div>
    </div>

    <!-- بەشی پیشاندانی تێکست -->
    <div id="readView">
        <h2>REBAR IT</h2>
        <div class="text-content" id="textContent"></div>
    </div>
</div>

<script>
    const UPSTASH_URL = "https://special-barnacle-157519.upstash.io";
    const UPSTASH_TOKEN = "gQAAAAAAAmdPAAIgcDIxYTZmZTdhODZiZDI0MjA3OWE5NzM5YmI1ZDc2OTA1NQ";

    function generateRandomId(length = 5) {
        const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let result = '';
        for (let i = 0; i < length; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
    }

    async function generateLink() {
        const text = document.getElementById('textInput').value;
        if (!text.trim()) {
            alert('تکایە سەرەتا تێکستێک بنووسە!');
            return;
        }

        const id = generateRandomId();
        document.getElementById('loadingText').style.display = 'block';
        document.getElementById('resultBox').style.display = 'none';

        try {
            const response = await fetch(`${UPSTASH_URL}/set/${id}`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${UPSTASH_TOKEN}`,
                    'Content-Type': 'text/plain'
                },
                body: text
            });

            if (response.ok) {
                const shortLink = `${window.location.origin}/?id=${id}`;
                document.getElementById('loadingText').style.display = 'none';
                document.getElementById('generatedLink').value = shortLink;
                document.getElementById('resultBox').style.display = 'block';
            } else {
                throw new Error('هەڵە لە پاشەکەوتکردن');
            }
        } catch (e) {
            document.getElementById('loadingText').style.display = 'none';
            alert('هەڵەیەک ڕووی دا.');
        }
    }

    function copyLink() {
        const linkInput = document.getElementById('generatedLink');
        linkInput.select();
        linkInput.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(linkInput.value);
        alert('لینکەکە بە سەرکەوتوویی کۆپی کرا!');
    }

    window.onload = async function() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        
        if (id) {
            document.getElementById('createView').style.display = 'none';
            document.getElementById('readView').style.display = 'block';
            document.getElementById('textContent').innerText = 'خەریکی هێنانی تێکستەکەی...';
            
            try {
                const response = await fetch(`${UPSTASH_URL}/get/${id}`, {
                    headers: {
                        'Authorization': `Bearer ${UPSTASH_TOKEN}`
                    }
                });
                const data = await response.json();
                
                if (data && data.result) {
                    document.getElementById('textContent').innerText = data.result;
                } else {
                    document.getElementById('textContent').innerText = 'بۆرە، ئەم تێکستە نەدۆزرایەوە یان بەسەرچووە.';
                }
            } catch (e) {
                document.getElementById('textContent').innerText = 'هەڵەیەک ڕووی دا لە هێنانی تێکستەکە.';
                console.error(e);
            }
        }
    }
</script>

</body>
</html>
